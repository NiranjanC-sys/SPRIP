[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "speaker-roi"
version = "1.0.0"
description = "HCP Speaker Program Impact & ROI Platform - multi-tenant causal measurement and planning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Runtime dependencies.
#
# Lower bounds are the oldest release we test against; upper bounds stop the
# next major from silently landing in a rebuild. `requirements.lock` (generated
# by `make lock`) is what CI and the images actually install.
# ---------------------------------------------------------------------------
dependencies = [
  # --- web / api -----------------------------------------------------------
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",

  # --- database ------------------------------------------------------------
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.2,<4",
  "greenlet>=3.0,<4",

  # --- auth / crypto -------------------------------------------------------
  "argon2-cffi>=23.1,<26",
  "pyjwt[crypto]>=2.9,<3",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "pyotp>=2.9,<3",

  # --- object storage ------------------------------------------------------
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",

  # --- jobs / cache --------------------------------------------------------
  "celery>=5.4,<6",
  "redis>=5.0,<7",
  "flower>=2.0,<3",

  # --- data processing -----------------------------------------------------
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=16.0",
  "polars>=1.0,<2",
  "openpyxl>=3.1,<4",
  "python-dateutil>=2.9,<3",
  "chardet>=5.2,<6",

  # --- modelling -----------------------------------------------------------
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.4,<5",
  "statsmodels>=0.14,<1",
  "scipy>=1.13,<2",

  # --- observability -------------------------------------------------------
  "structlog>=24.2,<26",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",

  # --- misc ----------------------------------------------------------------
  "httpx>=0.27,<1",
  "tenacity>=8.5,<10",
  "orjson>=3.10,<4",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.14,<4"]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5.0,<8",
  "pytest-randomly>=3.15,<4",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-python-dateutil",
  "faker>=26.0,<40",
  "freezegun>=1.5,<2",
  "respx>=0.21,<1",
]

[project.scripts]
speaker-roi = "speaker_roi_core.cli:app"

# ---------------------------------------------------------------------------
# Monorepo package mapping.
#
# The physical layout follows plan.md §17 (apps/, analytics/, packages/) while
# still producing one installable distribution, so `pip install -e .` wires the
# API, worker and analytics libraries together without path hacks.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = [
  "packages/core/src/speaker_roi_core",
  "apps/api/src/speaker_roi_api",
  "apps/worker/src/speaker_roi_worker",
  "analytics/src/speaker_roi_analytics",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".tools", "apps/web", "migrations/versions/_archive"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "TID",              # tidy imports
  "RUF",              # ruff rules
  "ASYNC",            # async correctness
  "S",                # bandit security
  "DTZ",              # naive datetime
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is the documented idiom
  "S101",    # asserts are how the synthetic generator states its invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"analytics/**" = ["S311"]          # numpy/stdlib RNG is intentional in synthesis
"packages/core/src/speaker_roi_core/db/session.py" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports]
# Analytics must stay free of web-framework and ORM coupling (plan.md §17).
banned-module-level-imports = []

[tool.ruff.lint.isort]
known-first-party = [
  "speaker_roi_core",
  "speaker_roi_api",
  "speaker_roi_worker",
  "speaker_roi_analytics",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
exclude = ['^\.venv/', '^\.tools/', '^apps/web/', '^migrations/versions/']

[[tool.mypy.overrides]]
module = [
  "lightgbm.*", "statsmodels.*", "sklearn.*", "scipy.*", "boto3.*",
  "botocore.*", "celery.*", "mlflow.*", "pyotp.*", "polars.*", "openpyxl.*",
  "prometheus_client.*", "authlib.*", "flower.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -p no:randomly"
markers = [
  "unit: pure logic, no external services",
  "integration: needs PostgreSQL / Redis / object storage",
  "security: authorization, tenant isolation and injection tests",
  "model_validation: statistical correctness of the estimators and forecasters",
  "e2e: full stack through the HTTP surface",
  "slow: takes more than ~10 seconds",
]
filterwarnings = [
  "error::DeprecationWarning:speaker_roi_.*",
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages/core/src", "apps/api/src", "apps/worker/src", "analytics/src"]
branch = true
omit = ["*/__main__.py", "*/migrations/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
