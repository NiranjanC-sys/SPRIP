# Alembic configuration.
#
# The database URL is intentionally NOT set here. It is read from the
# environment by migrations/env.py, because this file is committed and a URL in
# it would eventually carry a password. Set MIGRATION_DATABASE_URL (preferred,
# uses the DDL-owning `app_migrator` role) or DATABASE_URL.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Timestamped, slugged revision filenames sort chronologically in a directory
# listing, which is how anyone actually reads a migrations folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the above. UTC so filenames do not reorder when a contributor
# in another timezone adds a revision.
timezone = UTC

[post_write_hooks]
# Deliberately empty. Formatting a revision from here needs either a
# `console_scripts` entrypoint that ruff's wheel does not publish (it ships a
# binary shim, so the hook fails with "Could not find entrypoint
# console_scripts.ruff") or an absolute interpreter path that differs between
# Windows and POSIX. `scripts/verify` already runs ruff over the whole tree,
# including migrations/, so the only thing a hook here adds is a config file that
# breaks `alembic revision` on a fresh checkout.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
