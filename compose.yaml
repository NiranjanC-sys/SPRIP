# Development services for the Speaker ROI Platform.
# Matches the ports and credentials used by scripts/devtools/pg.py and services.py.
#
#   docker compose up -d
#
# Then run:
#   alembic upgrade head
#   python -m speaker_roi_api.cli admin bootstrap ...

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/devtools/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/speaker-roi-uploads &&
      mc mb --ignore-existing local/speaker-roi-exports &&
      mc mb --ignore-existing local/speaker-roi-artifacts
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
